name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SOURCE_DIR: jira-data-verification-doc
  PUBLIC_PATH: jira-data-verification-doc

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepare selected documentation
        run: |
          mkdir -p "_site/${PUBLIC_PATH}"
          cp -R "${SOURCE_DIR}/." "_site/${PUBLIC_PATH}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - id: deployment
        uses: actions/deploy-pages@v4
