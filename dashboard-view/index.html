<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevVine Developer Overview</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-2: #eef3f7;
      --ink: #14212b;
      --muted: #62717f;
      --line: #dbe4ec;
      --blue: #245bdb;
      --teal: #087f79;
      --green: #257a3e;
      --amber: #a96500;
      --red: #b42318;
      --red-bg: #fff1ef;
      --amber-bg: #fff7e8;
      --green-bg: #eef9f0;
      --blue-bg: #edf3ff;
      --shadow: 0 16px 48px rgba(24, 37, 51, 0.14);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        linear-gradient(90deg, rgba(36, 91, 219, 0.06) 1px, transparent 1px),
        linear-gradient(180deg, #fbfcfe 0%, var(--bg) 42%, #edf2f6 100%);
      background-size: 48px 48px, auto;
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    button, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 272px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      font-weight: 760;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      font-family: var(--mono);
      font-size: 13px;
    }

    .side-label {
      margin: 18px 0 7px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 720;
      text-transform: uppercase;
    }

    .profile-select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      padding: 10px;
      font-weight: 650;
    }

    .meta-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .meta-pill {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
    }

    .meta-pill strong {
      min-width: 0;
      overflow: hidden;
      color: var(--ink);
      font-weight: 740;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .section-nav {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .nav-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      padding: 9px 10px;
      text-align: left;
    }

    .nav-button:hover,
    .nav-button.active {
      border-color: var(--line);
      background: var(--surface);
      color: var(--ink);
    }

    .nav-count {
      min-width: 24px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      padding: 2px 7px;
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
    }

    .content {
      min-width: 0;
      padding: 22px 26px 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .view-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
    }

    .updated {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .hero {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 22px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      background: var(--blue);
    }

    .hero.critical::before { background: var(--red); }
    .hero.warning::before { background: var(--amber); }
    .hero.positive::before { background: var(--green); }

    .hero-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 760;
      text-transform: uppercase;
    }

    .critical { color: var(--red); background: var(--red-bg); }
    .warning { color: var(--amber); background: var(--amber-bg); }
    .positive { color: var(--green); background: var(--green-bg); }
    .low, .neutral, .unknown, .info { color: var(--blue); background: var(--blue-bg); }

    .hero h2 {
      margin: 0;
      max-width: 980px;
      font-size: clamp(26px, 4vw, 44px);
      line-height: 1.03;
      letter-spacing: 0;
    }

    .hero-details {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .detail-cell {
      border-top: 1px solid var(--line);
      padding-top: 11px;
    }

    .detail-cell span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 720;
      text-transform: uppercase;
    }

    .detail-cell p {
      margin: 0;
      color: #293946;
      line-height: 1.45;
    }

    .section { margin-top: 22px; }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
    }

    .section-head h3 {
      margin: 0;
      font-size: 17px;
    }

    .section-copy {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .section-type {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .grid.kpi { grid-template-columns: repeat(5, minmax(0, 1fr)); }

    .card {
      min-width: 0;
      min-height: 172px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 14px;
      text-align: left;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #b8c8d8;
      box-shadow: 0 12px 30px rgba(31, 48, 66, 0.1);
    }

    .card:focus-visible {
      outline: 3px solid rgba(36, 91, 219, 0.22);
      outline-offset: 2px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .source {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      white-space: nowrap;
    }

    .card-title {
      margin: 0 0 10px;
      font-size: 16px;
      line-height: 1.25;
    }

    .kpi .card-title { font-size: 14px; }

    .kpi-value {
      display: block;
      margin: 8px 0;
      color: var(--ink);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1;
      overflow-wrap: anywhere;
    }

    .movement {
      display: inline-flex;
      width: fit-content;
      margin-bottom: 9px;
      border: 1px solid #d8e1ea;
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1;
    }

    .card-copy {
      margin: 0 0 9px;
      color: #334554;
      line-height: 1.38;
    }

    .why {
      color: var(--muted);
      font-size: 13px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 11px;
    }

    .chip {
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-2);
      color: #526373;
      padding: 4px 8px;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .blocker-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .blocker-column {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .blocker-column-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      padding: 12px;
    }

    .blocker-column-head h4 {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
    }

    .blocker-column-head p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .blocker-count {
      flex: 0 0 auto;
      border-radius: 999px;
      background: #eaf0f6;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 4px 8px;
    }

    .blocker-rows { display: grid; }

    .blocker-row {
      appearance: none;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #fff;
      padding: 12px;
      text-align: left;
    }

    .blocker-row:last-child { border-bottom: 0; }
    .blocker-row:hover,
    .blocker-row:focus-visible { background: #f8fbff; outline: none; }

    .blocker-title {
      display: block;
      min-width: 0;
      overflow: hidden;
      color: var(--ink);
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .blocker-sub {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .blocker-action {
      align-self: start;
      color: var(--blue);
      font-weight: 750;
      white-space: nowrap;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      background: rgba(12, 22, 31, 0.28);
    }

    .drawer-backdrop.open { display: block; }

    .drawer {
      position: fixed;
      inset: 0 0 0 auto;
      z-index: 40;
      width: min(560px, 100vw);
      overflow: auto;
      border-left: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
      transform: translateX(105%);
      transition: transform 0.2s ease;
    }

    .drawer.open { transform: translateX(0); }

    .drawer-head {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      padding: 16px;
    }

    .drawer-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 18px;
    }

    .drawer h3 {
      margin: 10px 42px 0 0;
      font-size: 22px;
      line-height: 1.18;
    }

    .drawer-body { padding: 16px; }

    .drawer-section {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 14px;
    }

    .drawer-section:first-child {
      border-top: 0;
      padding-top: 0;
      margin-top: 0;
    }

    .drawer-section h4 {
      margin: 0 0 8px;
      font-size: 13px;
      font-family: var(--mono);
      text-transform: uppercase;
      color: var(--muted);
    }

    .threew { display: grid; gap: 10px; }

    .threew-row {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfd;
    }

    .threew-row b {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-size: 13px;
    }

    .threew-row p {
      margin: 0;
      color: #344654;
      line-height: 1.42;
      overflow-wrap: anywhere;
    }

    .evidence-list { display: grid; gap: 8px; }

    .evidence-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      background: #fff;
    }

    .evidence-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 650;
    }

    .evidence-type {
      flex: 0 0 auto;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
    }

    .params {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0f1720;
      color: #dce7f1;
      padding: 10px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      max-height: 360px;
    }

    details summary {
      cursor: pointer;
      color: var(--blue);
      font-weight: 700;
    }

    details .params { margin-top: 10px; }

    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 12px;
      margin: 0;
    }

    @media (max-width: 1120px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .grid,
      .grid.kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .blocker-board { grid-template-columns: 1fr; }
      .hero-details { grid-template-columns: 1fr; }
    }

    @media (max-width: 680px) {
      .content { padding: 16px; }
      .grid,
      .grid.kpi { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .updated { white-space: normal; }
    }
  </style>
</head>

      <div class="brand">

      </div>

      <select id="profileSelect" class="profile-select"></select>

    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <script>
    const doc = JSON.parse(document.getElementById("dashboard-data").textContent);
    const profileSelect = document.getElementById("profileSelect");
    const metaList = document.getElementById("metaList");
    const sectionNav = document.getElementById("sectionNav");
    const updated = document.getElementById("updated");
    const hero = document.getElementById("hero");
    const sectionsRoot = document.getElementById("sections");
    const drawer = document.getElementById("drawer");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const drawerClose = document.getElementById("drawerClose");
    const drawerBadge = document.getElementById("drawerBadge");
    const drawerTitle = document.getElementById("drawerTitle");
    const drawerBody = document.getElementById("drawerBody");
    let activeSection = "all";

    function unwrap(value) {
      if (value && typeof value === "object" && !Array.isArray(value)) {
        if (Object.prototype.hasOwnProperty.call(value, "$numberLong")) return value.$numberLong;
        if (Object.prototype.hasOwnProperty.call(value, "$numberInt")) return value.$numberInt;
        if (Object.prototype.hasOwnProperty.call(value, "$numberDouble")) return value.$numberDouble;
      }
      return value;
    }

    function text(value, fallback = "") {
      const v = unwrap(value);
      if (v === null || v === undefined || v === "") return fallback;
      if (typeof v === "string") return v;
      if (typeof v === "number" || typeof v === "boolean") return String(v);
      return JSON.stringify(v);
    }

    function escapeHtml(value) {
      return text(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function severityClass(value) {
      const v = text(value, "unknown").toLowerCase();
      if (["critical", "warning", "positive", "low", "neutral", "unknown", "info"].includes(v)) return v;
      return "unknown";
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return text(value, "time unavailable");
      return date.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function titleFromId(id) {
      const known = {
        at_a_glance: "At a glance",
        devvine_suggests: "DevVine Suggests",
        act_now: "Act now",
        needs_you: "Needs you",
        holding_up_others: "Blocked on you",
        waiting_on_others: "You're blocked by others",
        done_jira_not_prod: "Done in Jira, not in prod",
        service_level_issues: "Service level issues"
      };
      if (known[id]) return known[id];
      return text(id).replaceAll("_", " ").replace(/\b\w/g, char => char.toUpperCase());
    }

    function sectionDescription(id) {
      const known = {
        at_a_glance: "KPI strip from metricSlots/layout data in your pasted payload.",
        devvine_suggests: "Persisted recommendation cards from your pasted payload.",
        act_now: "Highest priority items from actNow.items in your pasted payload.",
        needs_you: "People and delivery buckets from sections.needsYou.",
        service_level_issues: "Service-level rows from sections.serviceLevelIssues."
      };
      return known[id] || "";
    }

    function labelFromWho(who) {
      return who?.primary || who?.displayName || who?.name || "";
    }

    function profileLabel() {
      const who = labelFromWho(doc.headline?.who);
      if (who) return who;
      return doc.scopeValue || doc.scope_value || "Developer overview";
    }

    function evidenceItems(card) {
      return [
        ...(Array.isArray(card.evidencePreview) ? card.evidencePreview : []),
        ...(Array.isArray(card.displayAnchors) ? card.displayAnchors : []),
        ...(Array.isArray(card.anchors) ? card.anchors.map(anchor => ({
          label: anchor.display_name,
          displayType: anchor.entity_type,
          sourceSystem: anchor.source_system,
          ref: anchor.anchor_id
        })) : [])
      ].filter(Boolean);
    }

    function normalizeSection(section) {
      return {
        id: section.id,
        title: section.title || titleFromId(section.id),
        type: section.type || "cards",
        items: Array.isArray(section.items) ? section.items : []
      };
    }

    function needsYouSections() {
      const needs = doc.sections?.needsYou || {};
      return [
        {
          id: "holding_up_others",
          title: "Blocked on you",
          description: "Rows from sections.needsYou.holdingUpOthers.",
          items: Array.isArray(needs.holdingUpOthers) ? needs.holdingUpOthers : []
        },
        {
          id: "waiting_on_others",
          title: "You're blocked by",
          description: "Rows from sections.needsYou.waitingOnOthers.",
          items: Array.isArray(needs.waitingOnOthers) ? needs.waitingOnOthers : []
        },
        {
          id: "done_jira_not_prod",
          title: "Done in Jira, not in prod",
          description: "Rows from sections.needsYou.doneInJiraNotProd.",
          items: Array.isArray(needs.doneInJiraNotProd) ? needs.doneInJiraNotProd : []
        }
      ];
    }

    function buildSections() {
      const sections = [];
      const layoutSections = Array.isArray(doc.layout?.sections) ? doc.layout.sections.map(normalizeSection) : [];
      const layoutIds = new Set(layoutSections.map(section => section.id));

      if (Array.isArray(doc.metricSlots) && !layoutIds.has("at_a_glance")) {
        sections.push({ id: "at_a_glance", title: "At a glance", type: "kpi_strip", items: doc.metricSlots });
      }

      sections.push(...layoutSections);

      const layoutItemIds = new Set(layoutSections.flatMap(section => section.items.map(item => item.id).filter(Boolean)));
      const actNowItems = Array.isArray(doc.actNow?.items) ? doc.actNow.items : [];
      const actNowDuplicatesLayout = actNowItems.length > 0 && actNowItems.every(item => item.id && layoutItemIds.has(item.id));
      if (actNowItems.length && !layoutIds.has("act_now") && !actNowDuplicatesLayout) {
        sections.push({ id: "act_now", title: "Act now", type: "suggestion_cards", items: actNowItems });
      }

      if (doc.sections?.needsYou) {
        sections.push({ id: "needs_you", title: "Needs you", type: "people_buckets", items: needsYouSections() });
      }

      if (Array.isArray(doc.sections?.serviceLevelIssues) && !layoutIds.has("service_level_issues")) {
        sections.push({ id: "service_level_issues", title: "Service level issues", type: "cards", items: doc.sections.serviceLevelIssues });
      }

      return sections;
    }

    const sections = buildSections();

    function allClickableCards() {
      return sections.flatMap(section => {
        if (section.id === "needs_you") {
          return section.items.flatMap(bucket => bucket.items.map(card => ({ section: bucket, card })));
        }
        return section.items.map(card => ({ section, card }));
      });
    }

    function chips(card) {
      const labels = [];
      if (card.frequencyChipLabel) labels.push(card.frequencyChipLabel);
      if (card.confidence) labels.push(card.confidence);
      if (card.status) labels.push(card.status);
      if (card.metricKey) labels.push(card.metricKey);
      evidenceItems(card).forEach(item => labels.push(item.label || item.display_name || item.displayType || item.entity_type || item.type));
      return labels.filter(Boolean).slice(0, 5).map(label => '<span class="chip">' + escapeHtml(label) + '</span>').join("");
    }

    function kpiValue(card) {
      if (card.value !== undefined && card.value !== null) return text(card.value);
      if (card.valueRaw !== undefined && card.valueRaw !== null) return text(card.valueRaw) + (card.unit === "percent" ? "%" : "");
      const match = text(card.what).match(/\bis\s+([+-]?\d+(?:\.\d+)?(?:\s?(?:%|\/day|ms|s|m|h|d|x))?)/i);
      return match ? match[1].trim() : "N/A";
    }

    function kpiMovement(card) {
      if (card.movementChip?.label) return card.movementChip.label;
      if (card.movement?.label) return card.movement.label;
      if (card.movement?.direction && card.movement?.delta) return card.movement.direction + " " + card.movement.delta;
      return "baseline unavailable";
    }

    function cardHtml(card, isKpi) {
      const sev = severityClass(card.severity);
      const score = Number.isFinite(Number(card.score)) ? "score " + card.score : "";
      const title = card.title || card.what || card.id || "Untitled";
      const body = card.body || card.what || card.reason || "";
      return '<button class="card" type="button" data-card-id="' + escapeHtml(card.id || title) + '">' +
        '<div class="card-meta"><span class="badge ' + sev + '">' + escapeHtml(sev) + '</span><span class="score">' + escapeHtml(score) + '</span></div>' +
        '<div class="source">' + escapeHtml(card.sourceType || card.metricKey || card.kind || "insight") + '</div>' +
        '<h4 class="card-title">' + escapeHtml(title) + '</h4>' +
        (isKpi ? '<strong class="kpi-value">' + escapeHtml(kpiValue(card)) + '</strong><span class="movement">' + escapeHtml(kpiMovement(card)) + '</span>' : '') +
        '<p class="card-copy">' + escapeHtml(body) + '</p>' +
        (card.why ? '<p class="why">' + escapeHtml(card.why) + '</p>' : '') +
        '<div class="chips">' + chips(card) + '</div>' +
      '</button>';
    }

    function bucketRowHtml(card, bucketId) {
      const evidence = evidenceItems(card)[0] || {};
      const title = evidence.label || evidence.display_name || card.title || card.what || card.id || "Item";
      const sub = [evidence.secondary, labelFromWho(card.who), evidence.status, evidence.age || evidence.ageLabel].filter(Boolean).join(" - ");
      const action = card.cta?.label || card.action?.label || "Open";
      return '<button class="blocker-row" type="button" data-bucket-id="' + escapeHtml(bucketId) + '" data-card-id="' + escapeHtml(card.id || title) + '">' +
        '<span><span class="blocker-title">' + escapeHtml(title) + '</span><span class="blocker-sub">' + escapeHtml(sub || card.body || card.what || "") + '</span></span>' +
        '<span class="blocker-action">' + escapeHtml(action) + '</span>' +
      '</button>';
    }

    function needsYouHtml(section) {
      return '<section class="section" id="needs_you">' +
        '<div class="section-head"><div><h3>Needs you</h3><p class="section-copy">' + escapeHtml(sectionDescription("needs_you")) + '</p></div><span class="section-type">people</span></div>' +
        '<div class="blocker-board">' + section.items.map(bucket =>
          '<div class="blocker-column">' +
            '<div class="blocker-column-head"><div><h4>' + escapeHtml(bucket.title) + '</h4><p>' + escapeHtml(bucket.description) + '</p></div><span class="blocker-count">' + escapeHtml(bucket.items.length) + '</span></div>' +
            '<div class="blocker-rows">' + (bucket.items.length ? bucket.items.map(card => bucketRowHtml(card, bucket.id)).join("") : '<p class="empty">No current rows in this overview.</p>') + '</div>' +
          '</div>'
        ).join("") + '</div></section>';
    }

    function sectionHtml(section) {
      if (section.id === "needs_you") return needsYouHtml(section);
      const isKpi = section.type === "kpi_strip" || section.id === "at_a_glance";
      return '<section class="section" id="' + escapeHtml(section.id) + '">' +
        '<div class="section-head"><div><h3>' + escapeHtml(section.title || titleFromId(section.id)) + '</h3>' +
        (sectionDescription(section.id) ? '<p class="section-copy">' + escapeHtml(sectionDescription(section.id)) + '</p>' : '') +
        '</div><span class="section-type">' + escapeHtml(section.type || "cards") + '</span></div>' +
        '<div class="grid ' + (isKpi ? "kpi" : "") + '">' +
          (section.items.length ? section.items.map(card => cardHtml(card, isKpi)).join("") : '<p class="empty">No current rows in this overview.</p>') +
        '</div></section>';
    }

    function countForSection(section) {
      if (section.id === "needs_you") return section.items.reduce((sum, bucket) => sum + bucket.items.length, 0);
      return section.items.length;
    }

    function renderMeta() {
      metaList.innerHTML =
        '<div class="meta-pill"><span>Scope</span><strong>' + escapeHtml(doc.scope || "unknown") + '</strong></div>' +
        '<div class="meta-pill"><span>Window</span><strong>' + escapeHtml(doc.rangeDays || doc.range_days || "N/A") + 'd</strong></div>' +
        '<div class="meta-pill"><span>Evidence</span><strong>' + escapeHtml(doc.source_evidence_count || doc.sourceEvidenceCount || 0) + '</strong></div>' +
        '<div class="meta-pill"><span>Period</span><strong>' + escapeHtml(doc.period_key || "N/A") + '</strong></div>';
    }

    function renderNav() {
      const total = sections.reduce((sum, section) => sum + countForSection(section), 0);
      const nav = [{ id: "all", title: "All", count: total }].concat(sections.map(section => ({
        id: section.id,
        title: section.title || titleFromId(section.id),
        count: countForSection(section)
      })));
      sectionNav.innerHTML = nav.map(item =>
        '<button class="nav-button ' + (item.id === activeSection ? "active" : "") + '" type="button" data-section="' + escapeHtml(item.id) + '">' +
          '<span>' + escapeHtml(item.title) + '</span><span class="nav-count">' + escapeHtml(item.count) + '</span>' +
        '</button>'
      ).join("");
    }

    function renderHero() {
      const h = doc.headline || {};
      const sev = severityClass(h.severity);
      hero.className = "hero " + sev;
      hero.innerHTML =
        '<div class="hero-line"><span class="badge ' + sev + '">' + escapeHtml(sev) + '</span><span class="source">based on ' + escapeHtml(doc.source_evidence_count || doc.sourceEvidenceCount || 0) + ' evidence items</span></div>' +
        '<h2>' + escapeHtml(h.text || "No dashboard headline available") + '</h2>' +
        '<div class="hero-details">' +
          '<div class="detail-cell"><span>What happened</span><p>' + escapeHtml(h.what || h.text || "No summary available") + '</p></div>' +
          '<div class="detail-cell"><span>Why it matters</span><p>' + escapeHtml(h.why || "No reason available") + '</p></div>' +
          '<div class="detail-cell"><span>Who is impacted</span><p>' + escapeHtml(labelFromWho(h.who) || "No primary impact listed") + '</p></div>' +
        '</div>';
    }

    function renderSections() {
      const visible = activeSection === "all" ? sections : sections.filter(section => section.id === activeSection);
      sectionsRoot.innerHTML = visible.map(sectionHtml).join("");
      sectionsRoot.querySelectorAll("[data-card-id]").forEach(button => {
        button.addEventListener("click", () => {
          const bucketId = button.dataset.bucketId;
          const found = allClickableCards().find(entry => {
            const id = entry.card.id || entry.card.title || entry.card.what;
            return text(id) === button.dataset.cardId && (!bucketId || entry.section.id === bucketId);
          });
          if (found) openDrawer(found.card, found.section);
        });
      });
    }

    function render() {
      profileSelect.innerHTML = '<option>' + escapeHtml(profileLabel()) + '</option>';
      updated.textContent = 'Updated ' + formatDate(doc.generated_at || doc.generatedAt) + ' - ' + profileLabel();
      renderMeta();
      renderNav();
      renderHero();
      renderSections();
    }

    function field(label, value) {
      if (!text(value)) return "";
      return '<div class="threew-row"><b>' + escapeHtml(label) + '</b><p>' + escapeHtml(value) + '</p></div>';
    }

    function evidenceList(card) {
      const items = evidenceItems(card);
      if (!items.length) return '<p class="empty">No linked evidence in this compact preview.</p>';
      return '<div class="evidence-list">' + items.slice(0, 20).map(item =>
        '<div class="evidence-item"><span class="evidence-label">' + escapeHtml(item.label || item.display_name || item.ref || item.anchor_id || "Evidence") + '</span>' +
        '<span class="evidence-type">' + escapeHtml(item.displayType || item.entity_type || item.type || item.sourceSystem || item.source_system || "") + '</span></div>'
      ).join("") + '</div>';
    }

    function openDrawer(card, section) {
      const sev = severityClass(card.severity);
      drawerBadge.className = "badge " + sev;
      drawerBadge.textContent = sev + " - " + (card.sourceType || section.id || "insight");
      drawerTitle.textContent = card.title || card.what || "Insight drilldown";
      const impacted = card.who || {};
      const impactedText = [
        impacted.primary,
        ...(impacted.affected || []),
        ...(impacted.actors || []),
        ...(impacted.owners || []),
        ...(impacted.services || [])
      ].filter(Boolean).slice(0, 10).join(", ");
      const params = card.drilldown?.params ? JSON.stringify(card.drilldown.params, null, 2) : "";
      const detail = card.detail || card.rootCause || card.display || {};
      drawerBody.innerHTML =
        '<section class="drawer-section"><div class="threew">' +
          field("What happened", card.what || card.body) +
          field("Why it happened or matters", card.why || card.reason) +
          field("Who is impacted", impactedText || labelFromWho(impacted)) +
          field("Suggested action", card.suggestedFix || card.recommendationHtml || card.action?.label || card.cta?.label) +
        '</div></section>' +
        '<section class="drawer-section"><h4>Evidence preview</h4>' + evidenceList(card) + '</section>' +
        '<section class="drawer-section"><h4>Developer debug</h4>' +
          (params ? '<details><summary>Show API params</summary><pre class="params">' + escapeHtml(params) + '</pre></details>' : '<p class="empty">No drilldown params available.</p>') +
          '<details><summary>Show raw card JSON</summary><pre class="params">' + escapeHtml(JSON.stringify({ section: section.id, card, detail }, null, 2)) + '</pre></details>' +
        '</section>';
      drawer.classList.add("open");
      drawerBackdrop.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      drawerBackdrop.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
    }

    sectionNav.addEventListener("click", event => {
      const button = event.target.closest("[data-section]");
      if (!button) return;
      activeSection = button.dataset.section;
      render();
    });
    drawerClose.addEventListener("click", closeDrawer);
    drawerBackdrop.addEventListener("click", closeDrawer);
    window.addEventListener("keydown", event => {
      if (event.key === "Escape") closeDrawer();
    });

    render();
  </script>
</body>
</html>
